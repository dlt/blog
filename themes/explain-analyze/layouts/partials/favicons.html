{{- with resources.Get "icons/favicon.svg" }}
  {{ $icon := . | fingerprint }}
  <link rel="icon" type="image/svg+xml" href="{{ $icon.RelPermalink }}">
{{- end }}
{{- with .Site.Params.favicon }}
  {{- with .png }}<link rel="icon" type="image/png" sizes="32x32" href="{{ . | relURL }}">{{ end }}
  {{- with .apple }}<link rel="apple-touch-icon" sizes="180x180" href="{{ . | relURL }}">{{ end }}
  {{- with .ico }}<link rel="shortcut icon" href="{{ . | relURL }}">{{ end }}
{{- end }}
